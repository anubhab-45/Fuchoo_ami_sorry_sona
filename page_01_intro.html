<!DOCTYPE html>
<html lang="bn">
<head>
<title>Sorry ফুচু ❤️ — Intro</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh;overflow-x:hidden;font-family:Poppins,sans-serif;color:white;background:radial-gradient(circle at 15% 15%,#67132e 0%,transparent 28%),radial-gradient(circle at 85% 85%,#43091f 0%,transparent 30%),linear-gradient(135deg,#080006,#19000d,#080006)}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.heart{position:absolute;bottom:-50px;animation:float linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(0) rotate(0deg);opacity:0}15%{opacity:.6}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.intro{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:center;text-align:center;background:#080006;transition:1.3s ease}
.intro.hide{opacity:0;pointer-events:none}
.intro-content{padding:30px}
.intro-small{letter-spacing:5px;font-size:11px;color:#ff9ab5;margin-bottom:20px}
.intro h1{font-family:"Great Vibes",cursive;font-size:clamp(70px,16vw,150px);font-weight:400;text-shadow:0 0 50px #ff4778}
.intro p{margin-top:20px;color:#aaa;font-size:14px}
.enter{margin-top:35px;padding:15px 35px;border:1px solid #ff527f;border-radius:100px;background:transparent;color:white;cursor:pointer;transition:.3s}
.enter:hover{background:#ff4778;transform:scale(1.05)}
main{position:relative;z-index:2}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 20px}
.card{width:min(720px,100%);padding:60px 35px;border-radius:35px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.1);animation:cardIn 1.5s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
.label{font-size:11px;letter-spacing:5px;color:#ff9ab5}
.hero h1{font-family:"Great Vibes",cursive;font-size:clamp(80px,17vw,145px);font-weight:400;line-height:.9;margin:20px 0 10px;text-shadow:0 0 35px rgba(255,60,110,.5)}
.ফুচু{font-size:29px;color:#ff6e98;font-weight:600}
.divider{width:80px;height:1px;margin:30px auto;background:#ff628d;box-shadow:0 0 20px #ff628d}
.message{max-width:560px;margin:auto;line-height:2;color:#ddd;font-size:15px}
.message strong{color:white}
.script{margin:30px 0;font-family:"Great Vibes",cursive;font-size:48px;color:#ff91ad}
.primary{margin-top:20px;border:0;padding:16px 35px;border-radius:100px;background:linear-gradient(135deg,#ff4778,#b8174c);color:white;font-weight:600;cursor:pointer;box-shadow:0 15px 35px rgba(255,50,100,.25);transition:.3s}
.primary:hover{transform:translateY(-3px) scale(1.03)}
.forgive{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:50px 20px}
.forgive-box{width:min(650px,100%);text-align:center;padding:60px 30px}
.forgive-box h2{font-family:"Great Vibes",cursive;font-size:75px;font-weight:400;color:#ff789f}
.forgive-box p{margin:20px auto 35px;color:#aaa}
.buttons{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}
.yes,.no{padding:14px 30px;border-radius:100px;cursor:pointer;font-family:Poppins;transition:.3s}
.yes{border:0;background:#ff4778;color:white}
.no{background:transparent;border:1px solid #555;color:#aaa}
.yes:hover{transform:scale(1.08);box-shadow:0 0 30px rgba(255,50,100,.4)}
.no:hover{border-color:#ff4778;color:white}
.final{display:none;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:30px}
.final.show{display:flex;animation:fadeIn 1.5s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.final-content{width:min(700px,100%)}
.final-heart{font-size:70px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.final h2{font-family:"Great Vibes",cursive;font-size:clamp(65px,13vw,110px);font-weight:400;color:#ff739b}
.final p{max-width:550px;margin:25px auto;line-height:2;color:#ddd}
.signature{margin-top:35px;font-family:"Great Vibes",cursive;font-size:40px;color:#ff7da1}
.small-footer{margin-top:50px;font-size:10px;letter-spacing:4px;color:#555}
.music{position:fixed;right:20px;bottom:20px;z-index:50;width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,120,160,.3);background:rgba(20,0,10,.7);backdrop-filter:blur(10px);color:#ff719a;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:20px}
.music.playing{animation:musicPulse 1.5s infinite}
@keyframes musicPulse{50%{box-shadow:0 0 25px rgba(255,60,110,.5)}}
@media(max-width:500px){.card{padding:45px 22px}.message{font-size:14px}.script{font-size:40px}.forgive-box h2{font-size:60px}}

html,body{margin:0;min-height:100%;scroll-behavior:smooth}
body{overflow-x:hidden}
.page-nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;
display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.page-nav a{text-decoration:none;color:#fff;background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:8px 14px;
border-radius:99px;font-size:12px}
.page-nav a:hover{background:rgba(255,71,120,.35)}
.single-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 20px 40px}
.single-page > *{max-width:900px}
</style>


<style>
.music-player{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:9999;display:flex;align-items:center;gap:10px;
  padding:9px 13px;border-radius:999px;
  background:rgba(20,12,20,.78);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.28);
}
.music-player button{
  border:0;background:transparent;color:#fff;cursor:pointer;
  font-size:16px;line-height:1;padding:6px 8px;
}
.music-player span{color:#fff;font:600 12px Arial,sans-serif;opacity:.92}
.music-player audio{display:none}
.music-note{position:fixed;right:16px;bottom:75px;z-index:9998;
  color:#fff;font:12px Arial,sans-serif;opacity:.75}
</style>

</head>
<body>
<nav class="page-nav"><a href="page_02_sorry.html">Sorry</a><a href="page_03_forgive.html">Forgive</a><a href="page_04_final.html">Final</a></nav>

<section class="intro" style="position:relative;min-height:100vh;opacity:1">
  <div class="intro-content">
    <div class="intro-small">THIS IS FOR YOU</div>
    <h1>ফুচু</h1>
    <p>একটা ছোট্ট কথা ছিল... ❤️</p>
    <a class="enter" href="page_02_sorry.html" style="display:inline-block;text-decoration:none">
      Open this for me
    </a>
  </div>
</section>


<div class="music-player">
  <button id="musicBtn" type="button" aria-label="Play music">▶</button>
  <span>our song ❤️</span>
  <audio id="siteMusic" preload="auto" loop>
    <source src="our-song.mp3" type="audio/mpeg">
  </audio>
</div>
<div class="music-note" id="musicNote">Click ▶ once to start the song</div>
<script>
(function(){
  const audio = document.getElementById('siteMusic');
  const btn = document.getElementById('musicBtn');
  const note = document.getElementById('musicNote');

  function setUI(){
    btn.textContent = audio.paused ? '▶' : '❚❚';
    note.textContent = audio.paused ? 'Click ▶ once to start the song' : '♪ Playing';
  }

  btn.addEventListener('click', async function(){
    try{
      if(audio.paused){ await audio.play(); }
      else { audio.pause(); }
      setUI();
      try{ sessionStorage.setItem('songPlaying','1'); }catch(e){}
    }catch(e){}
  });

  // Browser autoplay policies generally require one user gesture.
  // Once started, keep the choice for navigation within this tab.
  window.addEventListener('load', async function(){
    setUI();
    try{
      if(sessionStorage.getItem('songPlaying') === '1'){
        await audio.play();
        setUI();
      }
    }catch(e){}
  });
})();
</script>

</body>
</html>
